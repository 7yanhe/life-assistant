<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>数据读取（验收用）</title>
  <script src="js/dateutil.js"></script>
  <script src="js/storage.js"></script>
</head>
<body>
  <p>读取中……</p>
  <script>
    (function () {
      LifeApp.Storage.pickBrowserAdapter().load().then(function (data) {
        document.body.textContent = '已发送';
        fetch('http://localhost:8139/', {
          method: 'POST',
          body: JSON.stringify(data)
        }).then(function () {
          document.body.textContent = '发送完成';
        });
      }).catch(function (e) {
        document.body.textContent = '读取失败: ' + (e && e.message || e);
      });
    })();
  </script>
</body>
</html>
